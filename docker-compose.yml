services:
  nginx:
    image: nginx:alpine
    container_name: zerovaa-gateway
    ports:
      - "8081:80"
    volumes:
      - ./api-gateway/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - auth-service
      - product-service
      - order-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zerovaa-frontend
    volumes:
      - ./frontend:/var/www/html
    environment:
      APP_URL: http://localhost:8081
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: zerovaa-auth
    volumes:
      - ./auth-service:/var/www/html
    environment:
      APP_URL: http://localhost:8081
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      SERVICE_NAME: auth

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: zerovaa-product
    volumes:
      - ./product-service:/var/www/html
    environment:
      APP_URL: http://localhost:8081
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      SERVICE_NAME: products

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: zerovaa-order
    volumes:
      - ./order-service:/var/www/html
    environment:
      APP_URL: http://localhost:8081
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      SERVICE_NAME: orders

  db:
    image: mysql:8.4
    container_name: zerovaa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: zerovaa_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ./docker/mysql/init/02-seed-auth.sql:/docker-entrypoint-initdb.d/02-seed-auth.sql:ro
      - ./docker/mysql/init/03-seed-products.sql:/docker-entrypoint-initdb.d/03-seed-products.sql:ro
      - ./docker/mysql/init/04-seed-orders.sql:/docker-entrypoint-initdb.d/04-seed-orders.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
